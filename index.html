<!doctype html>
<!-- iOS 26 UI kit(aiuxplayground) 기반 한지훈의 가상 폰. 팬픽션용 시뮬레이션이며 Apple 공식 앱이 아닙니다. -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>한지훈의 iPhone · 읽씹?</title>
<link rel="stylesheet" href="https://aiuxplayground.com/kits/ios-26/v1/ios.css">
<style>
/* ---------- 프레임(기기 외형) ---------- */
html,body{margin:0;height:100%;background:#20252e}
*{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
#stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;background:radial-gradient(circle at top left,#546173,#1f232b 56%)}
#scaler{position:relative;width:calc(402px * var(--s,1));height:calc(874px * var(--s,1));flex:none}
#device{position:absolute;left:0;top:0;width:402px;height:874px;transform:scale(var(--s,1));transform-origin:0 0;border-radius:58px;overflow:hidden;box-shadow:0 0 0 9px #101216,0 0 0 10px rgba(255,255,255,.14),0 30px 70px rgba(0,0,0,.5)}
#phone{position:relative;width:402px;height:874px;overflow:hidden}
@media (max-width:640px){#stage{padding:0}#device{border-radius:0;box-shadow:none}}

/* ---------- 월페이퍼 / 공통 레이어 ---------- */
.wall{position:absolute;inset:0;background:radial-gradient(circle at 15% 18%,rgba(255,255,255,.5),transparent 32%),radial-gradient(circle at 85% 82%,rgba(100,126,199,.32),transparent 30%),linear-gradient(160deg,#819caf 0%,#d9c6c7 55%,#8496b6 100%)}
.layer{position:absolute;inset:0}
.homehit{position:absolute;left:0;right:0;bottom:0;height:44px;z-index:55;cursor:pointer}
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:50px;box-sizing:border-box}
.app>.ios-navbar .ios-navbar__bar:not(:has(button,a,.ios-navbar__inline-title)){height:20px;min-height:0;padding-bottom:0}
.appscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.appscroll::-webkit-scrollbar{display:none}
.avimg{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.sub{display:block;font:400 13px/17px var(--ios-font);color:var(--ios-secondary-label,#8a8a8e);margin-top:1px}
.pad{padding:4px 16px 10px}

/* ---------- 잠금화면 / 암호 ---------- */
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:80px 8px 54px;color:#fff;text-align:center}
.lock-date{font:600 20px/24px var(--ios-font);opacity:.92}
.lock-time{font:200 98px/1.05 var(--ios-font);letter-spacing:-3px;margin-top:2px}
.lock-notifs{width:100%;margin-top:34px;text-align:left}
.unlocktip{margin-top:auto;background:none;border:0;color:#fff;font:500 14px/18px var(--ios-font);opacity:.9;padding:10px 14px}
.lock-actions{width:100%;display:flex;justify-content:space-between;padding:0 38px;box-sizing:border-box;margin-top:10px}
.lock-actions .ios-button{width:50px;padding:0;border-radius:50%;color:#fff}
.pin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:118px 40px 0;color:#fff;box-sizing:border-box}
.pin-title{font:500 21px/26px var(--ios-font);margin-bottom:26px}
.pin-dots{display:flex;gap:20px;margin-bottom:12px}
.pin-dots span{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%}
.pin-dots .filled{background:#fff}
.pin-error{height:22px;font:400 14px/22px var(--ios-font);margin-bottom:14px}
.pin-grid{display:grid;grid-template-columns:repeat(3,78px);gap:16px 24px}
.pin-grid button{width:78px;height:78px;border-radius:50%;border:0;color:#fff;font:300 34px/1 var(--ios-font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pin-grid button small{font:600 10px/10px var(--ios-font);letter-spacing:2px;opacity:.9;height:10px}
.pin-grid button:active{filter:brightness(1.4)}
.pin-grid .txt{background:none;font:500 18px/1 var(--ios-font);box-shadow:none}
.pin-grid .ghost{visibility:hidden}

/* ---------- 홈 화면 ---------- */
.home{position:absolute;inset:0;padding:76px 22px 0;box-sizing:border-box}
.widgets{display:flex;gap:20px;justify-content:center}
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;margin-top:26px;justify-items:center}
.appgrid .ios-app,.dock .ios-app{cursor:pointer}
.ios-app__icon img{width:100%;height:100%;object-fit:cover}
.pages{position:absolute;left:0;right:0;bottom:134px;display:flex;justify-content:center;gap:8px}
.pages span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.pages span:first-child{background:#fff}
.dock{position:absolute;left:18px;right:18px;bottom:30px;height:96px;border-radius:40px;display:flex;justify-content:space-around;align-items:center;padding:0 12px}
.dock .ios-app__label{display:none}
.dock .ios-app{height:auto;min-height:0;gap:0;justify-content:center;align-self:center}
.home .ios-app__label{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.wg-eyebrow-red{color:var(--ios-red)}
.wg-music{display:flex;flex-direction:column;height:100%}
.wg-art{width:46px;height:46px;border-radius:10px;overflow:hidden;margin:8px 0 0}
.wg-music .wg-meta{margin-top:auto}
.wg-music .wg-meta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg-art img{width:100%;height:100%;object-fit:cover}

/* 카카오톡 채팅방 */
.kk{position:absolute;inset:0;background:#abc1d1;font-family:var(--ios-font);color:#191919}
.kk-scroll{position:absolute;inset:0;overflow-y:auto;padding:112px 10px 108px;box-sizing:border-box;display:flex;flex-direction:column}
.kk-scroll::-webkit-scrollbar{display:none}
.kk-msgs{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.kk-top{position:absolute;left:0;right:0;top:0;height:96px;background:rgba(171,193,209,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5}
.kk-bar{position:absolute;left:0;right:0;top:50px;height:46px}
.kk-back{position:absolute;left:12px;top:10px;border:0;background:none;padding:0;display:flex}
.kk-title{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;justify-content:center;font:500 16px/1 var(--ios-font);pointer-events:none}
.kk-tools{position:absolute;right:12px;top:10px;display:flex;gap:12px}
.kk-ic{display:flex}
.kk-toggle{position:absolute;left:50%;transform:translateX(-50%);top:104px;z-index:4;border:0;border-radius:100px;background:rgba(255,255,255,.65);color:#333;font:500 12px/1 var(--ios-font);padding:7px 14px}
.kk-day{align-self:center;background:rgba(0,0,0,.2);color:#fff;font:500 11px/1 var(--ios-font);padding:6px 14px;border-radius:100px;margin:10px 0 6px}
.kk-row{display:flex;align-items:flex-end;gap:4px}
.kk-row.me{justify-content:flex-end;padding-right:3px}
.kk-row.other{align-items:flex-start;gap:8px}
.kk-ava{width:38px;height:38px;flex:none}
.kk-ava img{width:100%;height:100%;object-fit:cover;border-radius:15px;display:block}
.kk-col{min-width:0}
.kk-name{font:400 12px/1 var(--ios-font);color:rgba(0,0,0,.7);margin:2px 0 5px 2px}
.kk-line{display:flex;align-items:flex-end;gap:4px}
.kk-bubble{position:relative;max-width:230px;padding:8px 10px;border-radius:13.5px;font:400 13px/1.4 var(--ios-font);white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.kk-row.me .kk-bubble{background:#ffe400}
.kk-row.other .kk-bubble{background:#fff}
.kk-bubble.tail::after{content:"";position:absolute;top:0;width:8px;height:14px}
.kk-row.me .kk-bubble.tail::after{right:-3px;background:#ffe400;clip-path:polygon(0 0,100% 0,0 100%)}
.kk-row.other .kk-bubble.tail::after{left:-3px;background:#fff;clip-path:polygon(100% 0,0 0,100% 100%)}
.kk-meta{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;min-height:1px}
.kk-unread{font:500 11px/1.2 var(--ios-font);color:#fbea58;letter-spacing:.4px}
.kk-time{font:500 9px/1.3 var(--ios-font);color:rgba(0,0,0,.6);white-space:nowrap}
.kk-inputwrap{position:absolute;left:0;right:0;bottom:34px;padding:8px 10px;box-sizing:border-box;z-index:5}
.kk-input{display:flex;align-items:center;gap:10px;padding:8px;border-radius:100px;background:rgba(255,255,255,.8);box-shadow:0 2px 12px -4px rgba(0,0,0,.12)}
.kk-circ{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.kk-field{flex:1;min-width:0;border:0;background:none;outline:0;font:500 14px/1.3 var(--ios-font);color:#191919}
.kk-field::placeholder{color:#97999b}
.kk-emoji{display:flex}
/* ---------- 카카오톡 ---------- */
.kakao-chat{flex:1;min-height:0;display:flex;flex-direction:column;background:#b2c7da}
.kakao-chat .ios-messages{flex:1;overflow-y:auto;justify-content:flex-end}
.kakao-chat .ios-bubble{white-space:pre-line}
.kakao-chat .ios-bubble[data-from="me"]{background:#fee500!important;color:#1a1700!important}
.kakao-chat .ios-bubble[data-from="them"]{background:#fff!important;color:#111!important}
.kakao-chat .ios-messages__time{color:rgba(255,255,255,.95)}
/* ---------- ChatGPT ---------- */
.gpt{position:absolute;inset:0;background:#fcfcfc;color:#0d0d0d;font-family:var(--ios-font);overflow:hidden}
.gpt-top{position:absolute;left:0;right:0;top:50px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.gpt-top-fade{top:0;padding-top:50px;padding-bottom:14px;background:linear-gradient(#fcfcfc 62%,rgba(252,252,252,0))}
.gpt-circle{width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#0d0d0d;box-shadow:0 2px 14px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.gpt-pill{height:48px;border-radius:24px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.05)}
.gpt-seg{display:flex;align-items:center;padding:0 5px;gap:2px;font:500 17px/1 var(--ios-font)}
.gpt-seg span{display:flex;align-items:center;justify-content:center;height:38px;padding:0 20px;border-radius:19px}
.gpt-seg .on{background:#ececec}
.gpt-tools{display:flex;align-items:center;gap:6px;padding:0 16px}
.gpt-tools button{border:0;background:none;color:#0d0d0d;padding:4px 8px}
.gpt-bottom{position:absolute;left:0;right:0;bottom:0}
.gpt-bottom-chat{bottom:36px;padding-top:24px;background:linear-gradient(rgba(252,252,252,0),#fcfcfc 40%)}
.gpt-comp{margin:0 12px;height:52px;border-radius:26px;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.05);display:flex;align-items:center;padding:0 8px 0 16px;gap:12px}
.gpt-plus,.gpt-mic{display:flex;color:#0d0d0d}
.gpt-ph{flex:1;display:flex;align-items:center;font:400 17px/1 var(--ios-font);color:#8e8e93;white-space:nowrap}
.gpt-caret{width:2px;height:22px;background:#4a63e7;margin-right:3px;animation:gptblink 1s steps(1) infinite}
@keyframes gptblink{50%{opacity:0}}
.gpt-wave{width:38px;height:38px;border-radius:50%;border:0;background:#3c5ce0;display:flex;align-items:center;justify-content:center;padding:0}
.gpt-corp{text-align:center;font:400 14px/18px var(--ios-font);color:#555;margin:20px 0 16px}
.gpt-bottom .ios-keyboard{position:relative}
.gpt-scroll{position:absolute;inset:0;overflow-y:auto;padding:116px 16px 150px;box-sizing:border-box}
.gpt-scroll::-webkit-scrollbar{display:none}
.gpt-msgs{display:flex;flex-direction:column}
.gpt-me{align-self:flex-end;max-width:86%;background:#eaefff;color:#3453d8;border-radius:26px;padding:15px 22px;font:500 17px/1.55 var(--ios-font);white-space:pre-line;margin:6px 0 30px}
.gpt-bot{font:400 17px/1.6 var(--ios-font);margin-bottom:26px;word-break:keep-all}
.gpt-bot p{margin:0 0 18px}
.gpt-bot b{font-weight:700}
.gpt-bot ol{margin:0 0 18px;padding-left:30px}
.gpt-bot li{margin-bottom:4px}
.gpt-acts{display:flex;gap:26px;margin-top:4px;color:#222}
.gpt-acts .ios-icon{--w:22px;--h:22px}
.gpt-side{position:absolute;left:0;top:0;bottom:0;width:322px}
.gpt-sidehead{position:absolute;left:0;right:0;top:50px;padding:0 24px 0 24px;display:flex;justify-content:space-between;align-items:center;font:600 24px/1 var(--ios-font)}
.gpt-sidescroll{position:absolute;left:0;right:0;top:112px;bottom:0;overflow-y:auto;padding:6px 12px 150px 12px}
.gpt-sidescroll::-webkit-scrollbar{display:none}
.gpt-menu{display:flex;align-items:center;gap:16px;height:46px;padding:0 10px;font:500 17px/1 var(--ios-font)}
.gpt-sec{font:600 17px/1 var(--ios-font);padding:38px 10px 10px}
.gpt-item{display:block;padding:11px 10px;border-radius:14px;font:400 17px/1.35 var(--ios-font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpt-item.cur{background:#f0f0f1}
.gpt-more{padding:12px 10px;font:400 17px/1.3 var(--ios-font);color:#b0b0b5}
.gpt-sidebtns{position:absolute;left:18px;right:22px;bottom:36px;display:flex;justify-content:space-between;align-items:center}
.gpt-newchat{height:50px;border-radius:25px;border:0;background:#3a5bdf;color:#fff;padding:0 22px;display:flex;align-items:center;gap:12px;font:600 20px/1 var(--ios-font);box-shadow:0 6px 18px rgba(58,91,223,.35)}
.gpt-peek{position:absolute;left:322px;top:0;bottom:0;width:402px;border-radius:44px 0 0 44px;background:#f5f5f6;box-shadow:-10px 0 34px rgba(0,0,0,.10);overflow:hidden;cursor:pointer}
.gpt-peek-circle{position:absolute;left:14px;top:50px;width:46px;height:46px;border-radius:50%;background:#fff;opacity:.7}
.gpt-peek-comp{position:absolute;left:18px;width:400px;bottom:330px;height:52px;border-radius:26px;background:#fafafa}
.gpt-peek-kb{position:absolute;left:0;right:0;bottom:0;height:300px;background:#ececef;border-radius:30px 0 0 0}

.chatbg{background:#b2c7da}
.preview{display:block;max-width:215px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 14px/18px var(--ios-font);color:var(--ios-secondary-label,#8a8a8e);margin-top:1px}

/* ---------- 사진 ---------- */
.wv-emoji{width:1.15em;height:1.15em;vertical-align:-.2em;margin-left:1px}
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.photogrid button{position:relative;border:0;padding:0;aspect-ratio:1/1;overflow:hidden;background:var(--ios-quaternary-fill,#eee)}
.photogrid img{width:100%;height:100%;object-fit:cover;display:block}
.viewer-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px}
.viewer-stage img,.viewer-stage video{max-width:100%;max-height:100%;border-radius:22px;background:#000}
.vdur{position:absolute;right:6px;bottom:5px;color:#fff;font:600 12px/14px var(--ios-font);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.viewer-cap{padding:6px 22px 8px;text-align:center;font:400 14px/19px var(--ios-font);color:rgba(255,255,255,.72)}
.ios-bubble{white-space:pre-line}

/* ---------- Instagram ---------- */
.insta-head{padding:6px 16px 14px}
.profileCard{display:flex;align-items:center;gap:14px}
.profileStats{display:flex;gap:16px;margin-left:auto;font:400 13px/17px var(--ios-font);text-align:center}
.profileStats b{display:block;font:700 17px/21px var(--ios-font)}
.bio{margin-top:12px;font:400 14px/20px var(--ios-font)}
.insta-btns{display:flex;gap:8px;margin-top:12px}
.insta-btns .ios-button{flex:1}
.storyBar{display:flex;gap:16px;padding:6px 16px 14px;overflow-x:auto}
.storyBar::-webkit-scrollbar{display:none}
.story{min-width:68px;text-align:center;font:400 12px/15px var(--ios-font);color:var(--ios-secondary-label,#8a8a8e)}
.ring{width:64px;height:64px;padding:2px;border-radius:50%;background:linear-gradient(135deg,#ffd85e,#ff3d77,#7a47ff);margin:0 auto 6px;box-sizing:border-box}
.ring>div{width:100%;height:100%;border-radius:50%;padding:2px;background:var(--ios-background,#fff);box-sizing:border-box}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.instaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.instaGrid img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}

/* ---------- X ---------- */
.tweet{padding:12px 16px;border-top:.5px solid var(--ios-separator,#ddd);display:flex;gap:12px;align-items:flex-start}
.tweet:first-child{border-top:0}
.tweet .tb{flex:1;min-width:0}
.tweet .user{font:700 15px/20px var(--ios-font)}
.tweet .user span{font-weight:400;color:var(--ios-secondary-label,#8a8a8e)}
.tweet .body{font:400 15px/21px var(--ios-font);margin-top:2px}
.tweet .meta{font:400 13px/17px var(--ios-font);color:var(--ios-secondary-label,#8a8a8e);margin-top:6px}

/* ---------- Weverse ---------- */
.wv{--wv:#66768d;position:absolute;inset:0;background:#f3f3f5}
.wv-bar{position:absolute;top:0;left:0;right:0;z-index:30}
.wv-barbg{position:absolute;inset:0;background:var(--wv);opacity:0;transition:opacity .2s}
.wv-bar.solid .wv-barbg{opacity:1}
.wv-bar .ios-navbar__inline-title{color:#fff;opacity:0;transition:opacity .2s;font-weight:700}
.wv-bar.solid .ios-navbar__inline-title{opacity:1}
.wv-bar .ios-barbutton{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:#fff}
.wv-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wv-scroll::-webkit-scrollbar{display:none}
.wvHero{position:relative;height:420px;box-sizing:border-box;padding-top:116px;display:flex;flex-direction:column;align-items:center;color:#fff;background:linear-gradient(180deg,#6d788d 0%,#8b92a6 52%,#a8adbd 100%);overflow:hidden}
.wv-mark{width:158px;height:auto;margin-top:6px;opacity:.95;filter:drop-shadow(0 4px 14px rgba(40,50,80,.25))}
.wv-mem{margin-top:auto;font:600 15px/20px var(--ios-font)}
.wv-mem span{font-weight:400;opacity:.9}
.wv-gname{font:800 54px/1.05 var(--ios-font);letter-spacing:-1px;margin:4px 0 14px}
.wv-membership{display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;padding:9px 16px 9px 11px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);font:700 18px/22px var(--ios-font)}
.wv-membership i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#3f9bff,#a24dff);display:grid;place-items:center;font-style:normal;font-size:15px}
.wv-tabs{position:sticky;top:116px;z-index:20;display:flex;justify-content:space-around;background:#fff;border-bottom:1px solid #ececf0}
.wv-tab{border:0;background:none;height:56px;padding:0 6px;font:700 17px/22px var(--ios-font);color:#2b2b2f;position:relative}
.wv-tab.on{color:var(--wv)}
.wv-tab.on:after{content:'';position:absolute;left:-6px;right:-6px;bottom:0;height:3px;background:var(--wv)}
.off{pointer-events:none}
.wv-chips{display:flex;gap:8px;padding:14px 16px 6px;background:#fff;overflow-x:auto}
.wv-chip{flex:none;border:1.5px solid #dedee3;background:#fff;border-radius:999px;padding:8px 16px;font:600 16px/20px var(--ios-font);color:#2b2b2f}
.wv-chip.on{background:var(--wv);border-color:var(--wv);color:#fff}
.wv-feedhead{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 16px;background:#fff}
.wv-feedhead b{font:800 24px/30px var(--ios-font)}
.wv-feedhead span{display:flex;align-items:center;gap:6px;font:500 15px/20px var(--ios-font);color:#3a3a40}
.wv-list{padding:12px 12px 70px}
.wvPost{background:#fff;border-radius:26px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.wvPost-head{display:flex;align-items:center;gap:10px;padding:16px 16px 0}
.wv-ava{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none}
.wv-name1{display:flex;align-items:center;gap:5px;font:800 15px/20px var(--ios-font)}
.wv-badge{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#19b9cf;color:#fff;font:700 10px/1 var(--ios-font)}
.wv-date{font:500 13px/17px var(--ios-font);color:#9a9aa2;display:flex;align-items:center;gap:5px}

function tickClock(){const t=clockText();document.querySelectorAll('.ios-statusbar__time,.lock-time').forEach(e=>{if(e.textContent!==t)e.textContent=t});const l=q('.lock-date');if(l){const d=dateText();if(l.textContent!==d)l.textContent=d;}}
setInterval(tickClock,1000);
let flags={};
const I=(n,s)=>`<i class="ios-icon ios-icon--${n}"${s?` style="${s}"`:''}></i>`;
const av=(src,size,extra='')=>`<span class="ios-avatar" style="--size:${size}px;${extra}"><img class="avimg" src="${src}" alt=""></span>`;
const statusBar=(white)=>`<div class="ios-island"></div><div class="ios-statusbar"${white?' style="color:#fff"':''}><div class="ios-statusbar__row"><span class="ios-statusbar__time">${clockText()}</span><span class="ios-statusbar__island-gap"></span><span class="ios-statusbar__icons">${I('cellular')}${I('wifi')}<span class="ios-battery" style="--level:100"><i></i></span></span></div></div>`;
const backBtn=(onclick)=>`<button class="ios-barbutton" aria-label="뒤로" onclick="${onclick}">${I('chevron-left')}</button>`;
const navInline=(title,lead='',trail='')=>`<header class="ios-navbar"><div class="ios-navbar__bar"><div class="ios-navbar__leading">${lead}</div><h1 class="ios-navbar__inline-title">${title}</h1><div class="ios-navbar__trailing">${trail}</div></div></header>`;
const navLarge=(title,lead='',trail='')=>`<header class="ios-navbar"><div class="ios-navbar__bar"><div class="ios-navbar__leading">${lead}</div><div class="ios-navbar__trailing">${trail}</div></div><h1 class="ios-navbar__large-title">${title}</h1></header>`;
const homeTail=()=>`<div class="homehit" onclick="goHome()"></div><div class="ios-home-indicator"></div>`;
const appWrap=(inner,extra='')=>`<div class="app">${inner}</div>${extra||homeTail()}`;
const segmented=(name,items,active,fn)=>`<div class="ios-segmented" style="--n:${items.length}" role="radiogroup">${items.map(([id,label])=>`<label><input type="radio" name="${name}" ${id===active?'checked':''} onchange="${fn}('${id}')">${label}</label>`).join('')}</div>`;
function flash(msg){state.toast=msg;render();setTimeout(()=>{if(state.toast===msg){state.toast=null;render();}},2800);}
function showToast(msg){flash(msg)}

function openApp(id){state.view='app';state.app=id;state.detail=null;state.photoIndex=null;if(id==='weverse')state.weverseTab='feed';if(id==='photos')state.photoScroll=null;if(id==='calendar')calInit();if(id==='ai'){state.aiThread=null;state.aiDrawer=false;}if(id==='x')state.xTab='search';if(!state.hinted){state.hinted=true;state.toast='아래 막대를 눌러 홈으로 돌아가요';setTimeout(()=>{if(state.toast){state.toast=null;render();}},2600);}render();}
function goHome(){state.view='home';state.app=null;state.detail=null;state.photoIndex=null;render();}
function openChat(name){state.detail=name;render();}
function openPhoto(i){const g=q('.photogrid');state.photoScroll=g?g.parentElement.scrollTop:null;state.photoIndex=i;render();}
function switchWeverse(tab){state.weverseTab=tab;render();}
function switchX(tab){state.xTab=tab;render();}
function switchCall(tab){state.callTab=tab;render();}
function contactDetail(i){state.detail='call'+i;render();}
function beginUnlock(){state.view='passcode';state.pin='';state.toast=null;render();}
function pressPin(n){if(state.pin.length>=4)return;state.pin+=String(n);if(state.pin.length===4){if(state.pin==='1107'){state.view='home';state.pin='';state.toast=null;render();}else{state.pin='';render();const e=q('.pin-error');if(e)e.textContent='암호가 올바르지 않습니다';}}else render();}
function pinBack(){if(state.pin.length){state.pin=state.pin.slice(0,-1);render();}else{state.view='lock';render();}}

function kkTime(min){const h=Math.floor(min/60)%24,m=min%60;return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+String(m).padStart(2,'0');}
function kakaoChatHTML(){
const old=state.oldChat,msgs=old?kakaoPast:kakaoCurrent;
const room=kakaoRooms.find(r=>r.name==='신신신정환');
let min=old?(8*60+47):(9*60+11);
const items=msgs.map((m,i)=>({k:m[0],t:m[1],min:m[0]==='day'?null:(min+=(i%3===1?1:0))}));
const lastMe=(()=>{let idx=-1;items.forEach((x,i)=>{if(x.k==='me')idx=i});return idx;})();
const rows=items.map((x,i)=>{
 if(x.k==='day')return `<div class="kk-day">${x.t}</div>`;
 const prev=items[i-1],next=items[i+1];
 const first=!prev||prev.k!==x.k,last=!next||next.k!==x.k;
 const time=kkTime(x.min);
 if(x.k==='me'){
  const unread=(!old&&i===lastMe)?'<span class="kk-unread">1</span>':'';
  return `<div class="kk-row me"><div class="kk-meta">${unread}${last?`<span class="kk-time">${time}</span>`:''}</div><div class="kk-bubble${first?' tail':''}">${x.t}</div></div>`;}
 return `<div class="kk-row other"><div class="kk-ava">${first?`<img src="${room.avatar}" alt="">`:''}</div><div class="kk-col">${first?'<div class="kk-name">신신신정환</div>':''}<div class="kk-line"><div class="kk-bubble${first?' tail':''}">${x.t}</div>${last?`<div class="kk-meta"><span class="kk-time">${time}</span></div>`:''}</div></div></div>`;}).join('');
return `<div class="kk"><div class="kk-scroll"><div class="kk-msgs">${rows}</div></div>
<div class="kk-top"><div class="kk-bar"><button class="kk-ic kk-back" aria-label="뒤로" onclick="state.detail=null;render()">${KK.back}</button><div class="kk-title">신신신정환</div><div class="kk-tools"><span class="kk-ic">${KK.search}</span><span class="kk-ic">${KK.cloud}</span><span class="kk-ic">${KK.bars}</span></div></div></div>
<button class="kk-toggle" onclick="state.oldChat=!state.oldChat;render()">${old?'현재 대화 보기':'과거 대화 보기'}</button>
<div class="kk-inputwrap"><div class="kk-input"><span class="kk-circ">${KK.plus}</span><input class="kk-field" placeholder="메시지 입력" aria-label="메시지" readonly><span class="kk-emoji">${KK.smile}</span><span class="kk-circ">${KK.hash}</span></div></div></div>${homeTail()}`;}

/* ---------- 캘린더 / 카메라 ---------- */
function calInit(){const d=new Date();state.calY=d.getFullYear();state.calM=d.getMonth();state.calSel=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function calMove(n){let m=state.calM+n,y=state.calY;if(m<0){m=11;y--}if(m>11){m=0;y++}state.calY=y;state.calM=m;render();}
function calPick(k){state.calSel=k;render();}
function calendarHTML(){
if(state.calY==null)calInit();
const now=new Date(),tk=now.getFullYear()+'-'+now.getMonth()+'-'+now.getDate();
const y=state.calY,m=state.calM,first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
let cells='<span></span>'.repeat(first);
for(let d=1;d<=dim;d++){const k=y+'-'+m+'-'+d;cells+=`<button class="cal-d${k===tk?' today':''}${k===state.calSel?' sel':''}" onclick="calPick('${k}')"><b>${d}</b>${k===tk?'<i></i>':''}</button>`;}
const [sy,sm,sd]=state.calSel.split('-').map(Number);const wd='일월화수목금토';
const label=`${sm+1}월 ${sd}일 ${wd[new Date(sy,sm,sd).getDay()]}요일${state.calSel===tk?' · 오늘':''}`;
const evs=state.calSel===tk?todayEvents:[];
const trail=`<button class="ios-barbutton" onclick="calInit();render()">오늘</button><button class="ios-barbutton" aria-label="이전 달" onclick="calMove(-1)">${I('chevron-left')}</button><button class="ios-barbutton" aria-label="다음 달" onclick="calMove(1)">${I('chevron-right')}</button>`;
return appWrap(navLarge(`${y}년 ${m+1}월`,backBtn("goHome()"),trail)+`<div class="appscroll"><div class="cal-wk">${[...wd].map(c=>`<span>${c}</span>`).join('')}</div><div class="cal-grid">${cells}</div>
<div class="ios-list" style="padding:8px 0 30px"><section class="ios-list__section"><h2 class="ios-list__header">${label}</h2><div class="ios-list__group">${evs.length?evs.map(e=>`<div class="ios-row" data-tall><span class="cal-bar" style="background:${e[1]};margin-right:12px"></span><div class="ios-row__body"><span class="ios-row__title">${e[0]}</span></div></div>`).join(''):`<div class="ios-row" data-tall><div class="ios-row__body"><span class="ios-row__title" style="color:var(--ios-secondary-label)">일정 없음</span></div></div>`}</div></section></div></div>`);}

 p.innerHTML=(flags.wall?'<div class="wall"></div>':'')+html+statusBar(flags.white)+hud;
 const ks=q('.kk-scroll');if(ks)ks.scrollTop=ks.scrollHeight;
 const pg=q('.photogrid');if(pg){const sc=pg.parentElement;sc.scrollTop=state.photoScroll==null?sc.scrollHeight:state.photoScroll;}
}

/* ---------- 기기 크기 맞춤 ---------- */
function fit(){const narrow=innerWidth<=640;const padX=narrow?0:56,padY=narrow?0:56;const s=Math.min(1,(innerWidth-padX)/402,(innerHeight-padY)/874);document.documentElement.style.setProperty('--s',Math.max(.3,s).toFixed(4));}
addEventListener('resize',fit);fit();

/* ---------- 제스처 ---------- */
let touchStartY=null,homeSwipeY=null;
const ph=q('#phone');
ph.addEventListener('touchstart',e=>{const y=e.touches[0].clientY;if(state.view==='lock')touchStartY=y;if(state.view==='app'&&e.target.closest('.homehit'))homeSwipeY=y;},{passive:true});
ph.addEventListener('touchend',e=>{const y=e.changedTouches[0].clientY;if(state.view==='lock'&&touchStartY!==null){if(touchStartY-y>55)beginUnlock();touchStartY=null;}if(homeSwipeY!==null){if(homeSwipeY-y>30)goHome();homeSwipeY=null;}},{passive:true});
ph.addEventListener('mousedown',e=>{if(state.view==='lock')touchStartY=e.clientY});
ph.addEventListener('mouseup',e=>{if(state.view==='lock'&&touchStartY!==null){if(touchStartY-e.clientY>45)beginUnlock();touchStartY=null;}});
render();
</script>
